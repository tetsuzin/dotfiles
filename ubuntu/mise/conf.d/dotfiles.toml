# repo 内のファイルをホームにシンボリックリンクで配置する。
# リンク元はテンプレートも環境変数も展開しない。
[dotfiles]
"~/.config/act/actrc" = "../../../dotfiles/.config/act/actrc"
"~/.config/git/config" = "../../../dotfiles/.config/git/config"
"~/.config/mise/config.toml" = "../../../dotfiles/.config/mise/config.toml"
"~/.config/mise/conf.d/settings.toml" = "../../../dotfiles/.config/mise/conf.d/settings.toml"
"~/.config/mise/conf.d/linux.toml" = "../../../dotfiles/.config/mise/conf.d/linux.toml"
"~/.config/starship.toml" = "../../../dotfiles/.config/starship.toml"
"~/.claude/settings.json" = "../../../dotfiles/.claude/settings.json"
"~/.claude/CLAUDE.md" = "../../../dotfiles/.claude/CLAUDE.md"
"~/.codex/AGENTS.md" = "../../../dotfiles/.codex/AGENTS.md"
"~/.bashrc" = "../../../dotfiles/.bashrc"
"~/.bash_profile" = "../../../dotfiles/.bash_profile"
"~/.bashrc_custom" = "../../../dotfiles/.bashrc_custom"
"~/.bash_profile_custom" = "../../../dotfiles/.bash_profile_custom"
"~/.config/dotfiles/bashrc_base" = "../../../dotfiles/.config/dotfiles/bashrc_base"
"~/.config/eza/theme.yaml" = "~/.local/share/dotfiles/eza-themes/themes/tokyonight.yml"
"~/.config/nvim" = "~/.local/share/dotfiles/lazyvim-starter"
