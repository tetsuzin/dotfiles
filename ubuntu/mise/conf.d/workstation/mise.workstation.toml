# 人が使うマシン向けに、最小構成へ重ねる追加分。-E workstation のときだけ読み込まれる。
include = [
  "../../../../dotfiles/.config/mise/conf.d/workstation.toml",
  "../../../../dotfiles/.config/mise/config.linux.toml",
]

# 既定ブランチに追従し、update で fast-forward する。
[bootstrap.repos]
"~/.local/share/dotfiles/eza-themes" = { url = "https://github.com/eza-community/eza-themes.git" }
"~/.local/share/dotfiles/lazyvim-starter" = { url = "https://github.com/LazyVim/starter.git" }

# apt で導入する OS パッケージ。
[bootstrap.packages]
"apt:bash-completion" = "latest"
"apt:libsecret-1-0" = "latest"

# リンク元の相対パスはこのファイルの位置が基準。
[dotfiles]

# mise
"~/.config/mise/conf.d/workstation.toml" = "../../../../dotfiles/.config/mise/conf.d/workstation.toml"
"~/.config/mise/config.linux.toml" = "../../../../dotfiles/.config/mise/config.linux.toml"

# git
"~/.config/act/actrc" = "../../../../dotfiles/.config/act/actrc"

# Terminal
"~/.config/starship.toml" = "../../../../dotfiles/.config/starship.toml"
"~/.config/eza/theme.yaml" = "~/.local/share/dotfiles/eza-themes/themes/tokyonight.yml"

# Editor
"~/.config/nvim" = "~/.local/share/dotfiles/lazyvim-starter"

# mise bootstrap の最後に実行する追加設定。
[tasks.bootstrap]
description = "ツール導入後の追加設定"
depends = ["krew:install"]

[tasks."krew:install"]
description = "未導入の krew プラグインをインストール"
shell = "bash -c"
run = """
set -euo pipefail
for plugin in krew explore fuzzy iexec images lineage ktop neat rolesum; do
  if ! krew list 2>/dev/null | grep -qx "${plugin}"; then
    krew install "${plugin}"
  fi
done
"""
