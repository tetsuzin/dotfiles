# mise bootstrap が導入する OS パッケージ。管理者権限は不要だが、
# インストーラが UAC プロンプトを出すことがある。
# 開発 CLI は dotfiles/.config/mise/conf.d/windows.toml の [tools] が担当する。
[bootstrap.packages]

# WinGet:

## パスワード管理ツール
"winget:Bitwarden.Bitwarden" = "latest"
"winget:Bitwarden.CLI" = "latest"

## ターミナル・シェル
"winget:Microsoft.WindowsTerminal" = "latest"
"winget:Microsoft.PowerShell" = "latest"
"winget:Microsoft.Coreutils" = "latest"

## テキストエディター・IDE
"winget:Microsoft.VisualStudioCode" = "latest"
"winget:Microsoft.Edit" = "latest"
"winget:Emurasoft.EmEditor" = "latest"

## 開発系ツール
"winget:Fork.Fork" = "latest"
"winget:LINQPad.LINQPad.9" = "latest"
"winget:icsharpcode.ILSpy" = "latest"
"winget:KirillOsenkov.MSBuildStructuredLogViewer" = "latest"
"winget:DevToys-app.DevToys" = "latest"
"winget:Microsoft.WinDbg" = "latest"

## ハードウェア関連
"winget:Logitech.OptionsPlus" = "latest"
"winget:CPUID.CPU-Z" = "latest"
"winget:TechPowerUp.GPU-Z" = "latest"
"winget:CrystalDewWorld.CrystalDiskInfo" = "latest"
"winget:CrystalDewWorld.CrystalDiskMark" = "latest"
"winget:WinDirStat.WinDirStat" = "latest"

## メディア系
"winget:MPC-BE.MPC-BE" = "latest"
"winget:neelabo.NeeView" = "latest"

## その他ツール系
"winget:Tailscale.Tailscale" = "latest"
"winget:Microsoft.PowerToys" = "latest"
"winget:M2Team.NanaZip" = "latest"

# scoop: ユーザー領域に入る CLI と GUI ツール。Git は Git Bash の提供元でもある。
# バケットは prepare.ps1 が追加する。scoop はバケット接頭辞を無視して名前で照合する。
"scoop:aria2" = "latest"
"scoop:duckdb" = "latest"
"scoop:git" = "latest"
"scoop:git-lfs" = "latest"
"scoop:gh" = "latest"
"scoop:gzip" = "latest"
"scoop:less" = "latest"
"scoop:redis" = "latest"
"scoop:sudo" = "latest"
"scoop:which" = "latest"
"scoop:zellij" = "latest"
"scoop:extras/rustdesk" = "latest"
