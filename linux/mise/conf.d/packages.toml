# mise bootstrap が外部から取得するもの。sudo が必要なのは apt パッケージだけ。

# 既定ブランチに追従し、bootstrap --update で fast-forward する。
[bootstrap.repos]
"~/.local/share/dotfiles/eza-themes" = { url = "https://github.com/eza-community/eza-themes.git" }
"~/.local/share/dotfiles/lazyvim-starter" = { url = "https://github.com/LazyVim/starter.git" }

# apt で導入する OS パッケージ。
[bootstrap.packages]
"apt:bash-completion" = "latest"
"apt:build-essential" = "latest"
"apt:ca-certificates" = "latest"
"apt:curl" = "latest"
"apt:git" = "latest"
"apt:less" = "latest"
"apt:libatomic1" = "latest"
"apt:libicu78" = "latest"
"apt:libgssapi-krb5-2" = "latest"
"apt:libsecret-1-0" = "latest"
"apt:libssl3t64" = "latest"
"apt:openssh-client" = "latest"
"apt:openssh-server" = "latest"
"apt:ripgrep" = "latest"
"apt:unzip" = "latest"
"apt:wget" = "latest"
"apt:xz-utils" = "latest"
"apt:zlib1g" = "latest"
