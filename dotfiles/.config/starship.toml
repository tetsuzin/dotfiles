format = """
\\[$username@$hostname $os\\] \
$directory\
($git_branch)\
$fill\
(\\[$dotnet$kubernetes\\] )\
$cmd_duration\
$time\
$line_break\
$character\
"""

palette = "catppuccin_mocha"

[fill]
symbol = " "

[username]
style_user = "yellow"
style_root = "red bold"
format = "[$user]($style)"
disabled = false
show_always = true

[hostname]
disabled = false
ssh_only = false
format = "[$hostname](blue)"

[os]
disabled = false
style = "fg:green"
format = "[$symbol]($style) "

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
Macos = "󰀵"
Linux = "󰌽"

[directory]
style = "cyan bold"
truncation_length = 5
truncation_symbol = "…/"
home_symbol = "~"
truncate_to_repo = false

[character]
disabled = false
success_symbol = "[>_](green)"
error_symbol = "[>_](red)"

[time]
disabled = false
format = '[$time]($style) '
style = 'bright-black'

[git_branch]
format = 'on [$symbol$branch]($style) '

[dotnet]
disabled = false
format = '\([$symbol($version)($tfm)]($style)\)'

[kubernetes]
disabled = false
detect_env_vars = ["STARSHIP_KUBERNETES_ENABLED"]
symbol = ""
# symbol = "⎈"
format = '\([$symbol](blue) |[$context](red):[$namespace](cyan)\)'

[line_break]
disabled = false

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
