# 全マシン共通のランタイムと CLI の最小構成。AI エージェントのワーカーはこれだけを使う。
# これ以外のファイルは人が使うマシンにだけ配置する。
#   conf.d/workstation.toml  全 OS 共通の追加分
#   config.<os>.toml         OS 固有の追加分。miserc.toml の auto_env が OS に合うものを読み込む
# 各 OS の mise.toml からも include されるため、include で許可されないセクション
# (settings など) は conf.d/settings.toml に書く。
[tools]
claude = "latest"
codex = "latest"
# Windows の dotnet は Visual Studio 側に任せる
dotnet = [
  { version = "10", os = ["linux", "macos"] },
  { version = "11", os = ["linux", "macos"] },
]
fd = "latest"
# Windows の gh は scoop / winget 側に任せる
gh = { version = "latest", os = ["linux", "macos"] }
jq = "latest"
node = "latest"
python = "3"
