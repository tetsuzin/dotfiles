# macOS のシステム設定。defaults と sudo の PAM 設定。
# defaults の反映には Dock と Finder の再起動が必要で、mise は自動では行わない。

[bootstrap.macos.dock]
autohide = false
show_recents = false
orientation = "left"

[bootstrap.macos.finder]
show_all_files = true

[bootstrap.macos.defaults]
# 拡張子の常時表示は Finder ではなくグローバルドメインの設定。
"NSGlobalDomain" = { AppleShowAllExtensions = true }

# sudo で Touch ID を使う。root 所有のため mise が sudo で書き込む。
# 既存がシンボリックリンクでも replace で実ファイルに置き換える。
[bootstrap.files."/etc/pam.d/sudo_local"]
content = """
auth       sufficient     pam_tid.so
"""
owner = "root"
group = "wheel"
mode = "0444"
replace = true
