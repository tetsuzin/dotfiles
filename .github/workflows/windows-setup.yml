name: Test Windows setup

on:
  push:
    branches: [master]
    paths:
      - windows/**
      - dotfiles/**
      - .github/workflows/windows-setup.yml
  pull_request:
    paths:
      - windows/**
      - dotfiles/**
      - .github/workflows/windows-setup.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mise
        shell: pwsh
        env:
          MISE_VERSION: 2026.10.12
        run: |
          irm https://mise.run/powershell | iex
          Add-Content $env:GITHUB_PATH "$HOME\.local\bin"
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          foreach ($file in 'windows/run.ps1', 'dotfiles/Documents/PowerShell/Microsoft.PowerShell_profile.ps1') {
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Out-String | Write-Error; exit 1 }
          }
      # ランナーでは msstore ソースの規約が未同意で、mise が呼ぶ winget list が失敗する。
      # packages.toml の winget パッケージは winget ソースだけで解決できるため、msstore を外す。
      - name: Remove winget msstore source
        shell: pwsh
        run: winget source remove --name msstore
      - name: Load configuration
        shell: pwsh
        run: |
          mise -C windows config ls
          mise -C windows bootstrap status
      - name: Dry-run tools
        shell: pwsh
        run: mise -C windows install --dry-run
      - name: Dry-run dotfiles via run.cmd
        shell: cmd
        working-directory: windows
        run: .\run.cmd link --dry-run
