name: Test Linux setup

on:
  push:
    branches: [master]
    paths:
      - ubuntu/**
      - dotfiles/**
      - scripts/**
      - .github/workflows/linux-setup.yml
  pull_request:
    paths:
      - ubuntu/**
      - dotfiles/**
      - scripts/**
      - .github/workflows/linux-setup.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mise
        env:
          MISE_VERSION: 2026.10.14
        run: |
          curl -fsSL https://mise.run -o "$RUNNER_TEMP/install-mise.sh"
          sh "$RUNNER_TEMP/install-mise.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check shell syntax
        run: |
          for script in ubuntu/run.sh scripts/_functions scripts/functions/*.sh ubuntu/scripts/*.sh dotfiles/.bash*; do
            bash -n "$script"
          done
      # 最小構成 (worker) と、workstation を重ねた構成の両方を読み込む。
      - name: Load configuration
        run: |
          mise -C ubuntu config ls
          mise -C ubuntu bootstrap packages status
          mise -C ubuntu -E workstation config ls
          mise -C ubuntu -E workstation bootstrap packages status
      - name: Dry-run tools
        run: mise -C ubuntu -E workstation install --dry-run
      - name: Fetch external repositories
        run: mise -C ubuntu -E workstation bootstrap --only repos
      # ランナーには既定の ~/.bashrc と ~/.bash_profile があり、置き換えを許可しないと競合で止まる。
      - name: Dry-run workstation dotfiles via run.sh
        working-directory: ubuntu
        run: ./run.sh link --dry-run --link-force=y
      # ランナーは使い捨てなので実際に配置する。既定の ~/.bashrc などは置き換える。
      # ホームに mise の設定が入るため、最後に実行する。
      - name: Apply worker dotfiles
        working-directory: ubuntu
        run: |
          ./run.sh link --env worker --link-force=y
          [[ -L ~/.bashrc && -L ~/.claude/CLAUDE.md ]]
          [[ ! -e ~/.config/starship.toml && ! -e ~/.config/nvim ]]
