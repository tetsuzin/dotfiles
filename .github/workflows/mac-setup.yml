name: Test macOS setup

on:
  push:
    branches: [master]
    paths:
      - mac/**
      - dotfiles/**
      - scripts/**
      - .github/workflows/mac-setup.yml
  pull_request:
    paths:
      - mac/**
      - dotfiles/**
      - scripts/**
      - .github/workflows/mac-setup.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mise
        run: |
          # 対応する最低バージョンで確かめる。値は mise.toml の min_version だけに書く。
          export MISE_VERSION="$(sed -n 's/^min_version = "\(.*\)"/\1/p' mac/mise.toml)"
          curl -fsSL https://mise.run -o "$RUNNER_TEMP/install-mise.sh"
          sh "$RUNNER_TEMP/install-mise.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check shell syntax
        run: |
          for script in mac/run.sh scripts/run.sh; do
            bash -n "$script"
          done
          for script in dotfiles/.z*; do
            zsh -n "$script"
          done
      - name: Load configuration
        run: |
          mise -C mac config ls
          mise -C mac bootstrap packages status
          mise -C mac bootstrap macos defaults status
          mise -C mac bootstrap files status
      - name: Dry-run tools
        run: mise -C mac install --dry-run
      - name: Fetch external repositories
        run: mise -C mac bootstrap --only repos
      - name: Dry-run dotfiles via run.sh
        working-directory: mac
        run: ./run.sh link --dry-run
