# mise bootstrap が導入する最小構成の apt パッケージ。sudo が必要。
# ubuntu/mise.toml からも include され、人が使うマシン向けの追加分は ubuntu/mise/conf.d に書く。

# apt で導入する OS パッケージ。
[bootstrap.packages]
"apt:build-essential" = "latest"
"apt:ca-certificates" = "latest"
"apt:curl" = "latest"
"apt:git" = "latest"
"apt:less" = "latest"
"apt:libatomic1" = "latest"
"apt:libicu78" = "latest"
"apt:libgssapi-krb5-2" = "latest"
"apt:libssl3t64" = "latest"
"apt:openssh-client" = "latest"
"apt:openssh-server" = "latest"
"apt:ripgrep" = "latest"
"apt:unzip" = "latest"
"apt:wget" = "latest"
"apt:xz-utils" = "latest"
"apt:zlib1g" = "latest"
